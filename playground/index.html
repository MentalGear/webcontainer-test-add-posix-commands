<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebContainer Unix Tools Playground</title>
  <link rel="stylesheet" href="./dist/main.css">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
    }
    h1 {
      color: #00d4ff;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #888;
      margin-bottom: 20px;
    }
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .panel {
      background: #16213e;
      border-radius: 8px;
      padding: 15px;
      border: 1px solid #0f3460;
    }
    .panel h2 {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #00d4ff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #terminal {
      background: #0d1117;
      padding: 0; /* Xterm has its own padding usually, but let's reset */
      border-radius: 6px;
      height: 400px;
      overflow: hidden; /* Xterm handles scroll */
    }
    button {
      padding: 10px 20px;
      background: #00d4ff;
      color: #000;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover {
      background: #00a8cc;
    }
    button:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }
    .status {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 14px;
    }
    .status.loading {
      background: #1e3a5f;
      color: #00d4ff;
    }
    .status.ready {
      background: #1e5f3a;
      color: #00ff88;
    }
    .status.error {
      background: #5f1e1e;
      color: #ff4444;
    }
    .commands-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }
    .command-btn {
      padding: 8px;
      font-size: 12px;
      background: #0f3460;
    }
    .command-btn:hover {
      background: #1a4a7a;
    }
    .examples {
      font-size: 12px;
      color: #888;
      margin-top: 10px;
    }
    .examples code {
      background: #0d1117;
      padding: 2px 6px;
      border-radius: 4px;
      color: #00d4ff;
    }
    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <h1>WebContainer Unix Tools Playground</h1>
  <p class="subtitle">Test grep, find, sed, uniq, test, and dirs commands in WebContainers</p>

  <div class="container">
    <div class="panel">
      <h2>Terminal</h2>
      <div id="status" class="status loading">Booting WebContainer...</div>
      <div id="terminal"></div>
      <div class="examples">
        <strong>Try:</strong>
        <code>grep hello test.txt</code> |
        <code>find . -name "*.txt"</code> |
        <code>sed 's/hello/hi/g' test.txt</code>
      </div>
    </div>

    <div class="panel">
      <h2>Quick Commands</h2>
      <div class="commands-list">
        <button class="command-btn" data-cmd="ls -la">ls -la</button>
        <button class="command-btn" data-cmd="cat test.txt">cat test.txt</button>
        <button class="command-btn" data-cmd="grep hello test.txt">grep hello</button>
        <button class="command-btn" data-cmd="grep -i HELLO test.txt">grep -i</button>
        <button class="command-btn" data-cmd="find . -name '*.txt'">find *.txt</button>
        <button class="command-btn" data-cmd="find . -type f">find files</button>
        <button class="command-btn" data-cmd="sed 's/hello/hi/g' test.txt">sed replace</button>
        <button class="command-btn" data-cmd="uniq dupes.txt">uniq</button>
        <button class="command-btn" data-cmd="test -f test.txt && echo exists">test -f</button>
        <button class="command-btn" data-cmd="cat test.txt | grep hello">pipe test</button>
        <button class="command-btn" data-cmd="dirs">dirs</button>
        <button class="command-btn" data-cmd="cat numbers.txt | sort | uniq">sort | uniq</button>
      </div>

      <h2>Files in Container</h2>
      <div id="files" style="font-family: monospace; font-size: 12px; color: #888;">
        Loading...
      </div>
    </div>
  </div>

  <script type="module" src="./dist/main.js"></script>
</body>
</html>
